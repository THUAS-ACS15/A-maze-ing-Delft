name: Validate Codeowners

on:
  pull_request:
    paths:
      - '.github/CODEOWNERS'

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: CI  # Links this job to the CI environment
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate CODEOWNERS
        uses: mszostok/codeowners-validator@v0.7.4
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        with:
          #github_access_token: ${{ secrets.ORG_READ_TOKEN }}
          # Checks that assigned owners and teams actually exist in GitHub
          checks: 'files,owners'