name: Auto Assign Code Owners

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  assign-reviewers:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Assign Reviewers
        uses: kentaro-m/auto-assign-action@v2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_READ_TOKEN }}