name: A-maze-ing-Delft CI
run-name: CI Linting, Type Check and Testing for ${{ github.ref_name }} by @${{ github.actor }}
description: Automated code quality and testing pipeline that enforces formatting (Black), linting (Ruff), and static type safety (Mypy) and testing on main branch pushes and pull requests.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff mypy pytest

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Type check with Mypy
        run: |
          mypy .
      - name: Testing
        run: |
          pytest