[project]
name = "a-maze-ing-delft"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain-core==1.6.13",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = [
    "I001",  # Unsorted or unformatted import block
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
    "--cov=src",
    "--cov=db",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["src", "db"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/assets/*",
    "*/config.py"
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

