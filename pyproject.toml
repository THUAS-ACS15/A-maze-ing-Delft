[project]
name = "a-maze-ing-delft"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "art>=6.5",
    "pillow>=12.3.0",
    "pyfiglet>=1.0.4",
    "pytest>=9.1.1",
    "rich>=15.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = [
    "I001",  # Unsorted or unformatted import block
]

