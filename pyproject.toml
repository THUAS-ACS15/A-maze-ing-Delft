[project]
name = "a-maze-ing-delft"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "art>=6.5",
    "langchain-core>=1.6.12",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "pillow>=12.3.0",
    "pyfiglet>=1.0.4",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "readchar>=4.2.2",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = [
    "I001",  # Unsorted or unformatted import block
]

